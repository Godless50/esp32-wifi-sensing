name: wsn
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: wsn-server
    command: ["python", "-m", "wsn"]
    user: "${WSN_UID:-1000}:${WSN_GID:-1000}"  # файлы в data/ принадлежат пользователю хоста
    environment:
      WSN_UDP_PORT: "5005"
      WSN_HTTP_PORT: "8080"
      WSN_DATA: /data
      WSN_UI: /ui
      TZ: Europe/Moscow
      WSN_SOUND_HZ: "${WSN_SOUND_HZ:-100}"  # зонды сервера -> платы (0 — выключить)
    volumes:
      - ../data:/data
      - ../ui:/ui:ro
    ports:
      - "5005:5005/udp"
      - "127.0.0.1:8080:8080"   # снаружи только через caddy (TLS + пароль)
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file: ../data/caddy.env   # WSN_HOST, WSN_UI_HASH — создаёт tools/ui_password.sh
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "8443:8443"
    depends_on: [api]
    restart: unless-stopped

volumes:
  caddy_data:
