[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wsn"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]
# install.sh: прошивка плат и QR-код сопряжения — тем же образом сервера, без Python на компьютере клиента
tools = ["esptool>=4.7,<5", "qrcode>=7.4"]

[tool.setuptools.packages.find]
include = ["wsn*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
