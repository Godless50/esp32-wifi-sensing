<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квартира</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;650;750&display=swap" rel="stylesheet">
<style>
  /* Тепловая карта квартиры: тихие комнаты — холодный сланец, движение — тепло от янтаря к малиновому,
     дыхание — бирюзовое кольцо, которое пульсирует с измеренной частотой. */
  :root {
    --bg: #1c2533; --panel: #222d3d; --line: #33415a; --floor: #2a3648; --wall: #8c9bb0;
    --text: #e9edf2; --muted: #97a3b4; --warm: #f3b23e; --hot: #e9466b; --breath: #4fc6b8; --ok: #5cc98a; --bad: #e9466b;
    --focus: #f3b23e;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #e9eef3; --panel: #f7f9fb; --line: #cfd8e3; --floor: #ffffff; --wall: #6b7a90;
      --text: #18212d; --muted: #5a6677; --warm: #e39a18; --hot: #d42f58; --breath: #1f9e92; --ok: #2f9e62; --bad: #d42f58;
      --focus: #d42f58; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #e9eef3; --panel: #f7f9fb; --line: #cfd8e3; --floor: #ffffff; --wall: #6b7a90;
    --text: #18212d; --muted: #5a6677; --warm: #e39a18; --hot: #d42f58; --breath: #1f9e92; --ok: #2f9e62; --bad: #d42f58;
    --focus: #d42f58; color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 400 15px/1.45 "Onest", system-ui, sans-serif; font-variant-numeric: tabular-nums;
    display: grid; grid-template-rows: auto 1fr; min-height: 100dvh;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 12px 20px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 750; letter-spacing: -0.01em; }
  #boards { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); }
  .board { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--bad); }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .tools button, .menu summary {
    font: 500 13px/1 "Onest", system-ui, sans-serif; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; list-style: none;
  }
  .tools button[aria-pressed="true"] { border-color: var(--warm); }
  .menu { position: relative; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu nav {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; min-width: 180px; padding: 6px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: grid;
  }
  .menu nav a { color: var(--text); text-decoration: none; padding: 8px 10px; border-radius: 8px; font-size: 14px; }
  .menu nav a:hover { background: var(--line); }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
  #plan { position: relative; min-height: 0; overflow: hidden; }
  #plan canvas { display: block; width: 100%; height: 100%; }
  .tag {
    position: absolute; transform: translate(-50%, -50%); pointer-events: none; text-align: center; white-space: nowrap;
    font-size: 13px; line-height: 1.25; text-shadow: 0 1px 2px color-mix(in srgb, var(--bg) 80%, transparent);
  }
  .tag b { display: block; font-weight: 650; font-size: 14px; }
  .tag span { color: var(--muted); }
  .tag.active span { color: var(--warm); }
  .tag.board-tag { font-size: 11px; color: var(--muted); }
  #legend {
    position: absolute; left: 16px; bottom: 14px; display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--muted);
  }
  #legend i { display: block; width: 120px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--floor), var(--warm), var(--hot)); border: 1px solid var(--line); }
  #notice { position: absolute; left: 16px; top: 12px; right: 16px; font-size: 13px; color: var(--muted); }

  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 8px 0; }
  .room { display: grid; grid-template-columns: 6px 1fr; gap: 0 14px; padding: 14px 20px 12px 14px; }
  .room + .room { border-top: 1px solid var(--line); }
  .meter { grid-row: 1 / span 4; width: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
  .meter div { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 3px; background: var(--warm); transition: height .4s ease; }
  .room h2 { margin: 0; font-size: 18px; font-weight: 650; }
  .room .state { margin-top: 2px; font-size: 14px; }
  .room.active .state { color: var(--warm); font-weight: 500; }
  .room .breath { margin-top: 2px; font-size: 14px; color: var(--breath); display: flex; align-items: center; gap: 6px; }
  .room .breath[hidden] { display: none; }
  .room .breath .dot { background: var(--breath); animation: breathe var(--period, 4s) ease-in-out infinite; }
  .room .src { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .room canvas { margin-top: 8px; width: 100%; height: 28px; display: block; }
  @keyframes breathe { 0%, 100% { transform: scale(0.6); opacity: .5; } 50% { transform: scale(1.3); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .room .breath .dot { animation: none; } }

  @media (max-width: 820px) {
    header { padding: 10px 16px; }
    main { grid-template-columns: 1fr; grid-template-rows: 54dvh auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    .room { padding: 12px 16px 10px 12px; }
    .tools { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Квартира</h1>
  <div id="boards" aria-live="polite"></div>
  <div class="tools">
    <button id="who" aria-pressed="false" title="Где, по оценке, сейчас тот, кто двигается">Положение</button>
    <button id="view" title="Сверху или под углом">Под углом</button>
    <details class="menu"><summary>Ещё</summary>
      <nav>
        <a href="/people">Кто где</a><a href="/scenario">Сценарий</a><a href="/data">Записи</a>
        <a href="/device">Плата</a><a href="/capture">Съёмка плана</a><a href="/scene3d">Старый 3D-план</a>
      </nav>
    </details>
  </div>
</header>
<main>
  <section id="plan" aria-label="План квартиры: цвет комнаты — сила движения в ней">
    <div id="notice">Подключаюсь…</div>
    <div id="legend"><span>тихо</span><i></i><span>движение</span></div>
  </section>
  <aside id="rooms" aria-label="Комнаты"></aside>
</main>
<script type="module" src="/static/home/home.js"></script>
</body>
</html>
