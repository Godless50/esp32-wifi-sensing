<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Квартира 3D</title>
<style>
  :root {
    --bg: #0f1216; --panel: #171b21; --line: #262c35; --text: #e6e9ee; --muted: #8a93a1;
    --ok: #3fb68b; --warn: #e0a43a; --bad: #e0564f; --accent: #5aa2ff;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #f5f6f8; --panel: #ffffff; --line: #dde1e7; --text: #1b1f24; --muted: #5f6873; }
  }
  :root[data-theme="light"] { --bg: #f5f6f8; --panel: #ffffff; --line: #dde1e7; --text: #1b1f24; --muted: #5f6873; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  nav a { color: var(--muted); text-decoration: none; margin-right: 10px; font-size: 13px; }
  nav a:hover { color: var(--text); }
  .group { display: flex; gap: 6px; align-items: center; }
  button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #motion { display: flex; align-items: center; gap: 8px; min-width: 220px; }
  #motion .bar { flex: 1; height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; min-width: 120px; }
  #motion .fill { height: 100%; width: 0; background: var(--ok); transition: width .2s, background-color .2s; }
  #motion .val { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); width: 112px; }
  #where, #breath, #board { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #breath { color: var(--accent); }
  #conn { margin-left: auto; font-size: 12px; color: var(--muted); }
  #conn.bad { color: var(--bad); font-weight: 600; }
  #view { flex: 1; position: relative; min-height: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #note { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 6px 10px; border-radius: 6px; max-width: calc(100% - 24px); }
  #personBox { position: absolute; left: 12px; top: 10px; font-size: 13px; font-weight: 600; color: var(--text); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 6px 10px; border-radius: 6px; max-width: calc(100% - 24px); }
  @media (max-width: 640px) { header { padding: 8px 12px; } #conn { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>Квартира</h1>
  <nav><a href="/device">Плата</a><a href="/capture">Съёмка</a><a href="/scenario">Сценарий</a><a href="/people">Кто где</a><a href="/data">Данные</a></nav>
  <div class="group">
    <button id="top" aria-pressed="false">Сверху</button>
    <button id="persp" aria-pressed="true">Перспектива</button>
  </div>
  <label><input type="checkbox" id="traj"> траектории</label>
  <label title="Клетки пола, где может быть человек: чем ярче, тем вероятнее"><input type="checkbox" id="heat" checked> где может быть</label>
  <button id="reload" title="Перечитать план">Обновить план</button>
  <div id="motion" title="Движение по CSI: 1 ≈ покой за последнюю минуту">
    <span>Движение</span><div class="bar"><div class="fill"></div></div><span class="val">—</span><span id="where" title="Зона, рядом с передатчиком которой линия связи сильнее всего отклонилась от своего фона"></span><span id="board" title="Ответ модели, которая работает на самой плате ESP32-S3"></span><span id="breath" title="Медленные периодичные изменения CSI 6–30 раз в минуту у неподвижного человека рядом с линией"></span>
  </div>
  <span id="conn">подключение…</span>
</header>
<div id="view"><div id="personBox">Человек: ждём данных трекера</div><div id="note">загрузка плана…</div></div>
<script type="module" src="/static/scene/scene.js"></script>
</body>
</html>
